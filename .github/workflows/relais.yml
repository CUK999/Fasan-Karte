name: Nostr-Relays pruefen

on:
  push:
    branches: [main]
    paths: ['tools/relaistest.mjs', '.github/workflows/relais.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Relays testen (senden, empfangen, nicht speichern)
        run: node tools/relaistest.mjs
