name: Karte bauen und veroeffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # Koordinaten (site/orte.json) zurueck ins Repo schreiben
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Koordinaten bei OpenStreetMap holen
        run: python3 tools/geocode.py data/orte.csv site/orte.json

      - name: Koordinaten im Repo sichern
        run: |
          if [ -n "$(git status --porcelain site/orte.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add site/orte.json
            git commit -m "Koordinaten aktualisiert"
            git push
          fi

      - name: Leaflet einbinden
        run: |
          npm pack leaflet@1.9.4 --silent
          tar -xzf leaflet-1.9.4.tgz
          mkdir -p site/vendor/leaflet
          cp -r package/dist/. site/vendor/leaflet/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
