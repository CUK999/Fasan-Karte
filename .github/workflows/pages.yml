name: Karte bauen und veroeffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 */2 * * *'   # Wetter etwa alle 2 Stunden (GitHub startet Zeitpläne teils verspätet)

permissions:
  contents: write   # Daten, Bilder und Leaflet zurueck ins Repo schreiben
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Orte pruefen und anreichern (OSM, Wikipedia, Wikimedia Commons)
        run: python3 tools/daten.py

      - name: Wetter holen (IPMA, Open-Meteo; nur hier, nie vom Handy)
        run: python3 tools/wetter.py 2>&1 | tee wetter.txt || true

      - name: Umgebung aus OSM holen (Supermärkte, WC, Apotheken, Geld, Wasser; höchstens täglich)
        run: python3 tools/umgebung.py 2>&1 | tee umgebung.txt || true

      - name: Stadtführer aus Wikipedia (Artikel mit Koordinaten; höchstens alle 6 Tage)
        run: python3 tools/stadtfuehrer.py 2>&1 | tee stadtfuehrer.txt || true

      - name: Höhenraster (Copernicus DEM GLO-30, AWS Open Data; höchstens alle 30 Tage)
        run: |
          pip install --quiet rasterio numpy 2>&1 | tail -2 || true
          python3 tools/hoehe.py 2>&1 | tee hoehe.txt || true

      - name: Länder-Grundinfos (Wikidata, CC0; höchstens alle 30 Tage)
        run: python3 tools/laender.py 2>&1 | tee laender.txt || true

      - name: Leaflet einbinden (einmalig ins Repo)
        run: |
          if [ ! -f site/vendor/leaflet/leaflet.js ]; then
            npm pack leaflet@1.9.4 --silent
            tar -xzf leaflet-1.9.4.tgz
            mkdir -p site/vendor/leaflet
            cp -r package/dist/. site/vendor/leaflet/
            rm -rf package leaflet-1.9.4.tgz
          fi

      - name: QR-Code-Bibliothek einbinden (qrcode-generator, MIT; einmalig ins Repo)
        run: |
          if [ ! -f site/vendor/qrcode/qrcode.js ]; then
            npm pack qrcode-generator@1.4.4 --silent || npm pack qrcode-generator --silent
            mkdir -p qr && tar -xzf qrcode-generator-*.tgz -C qr
            mkdir -p site/vendor/qrcode
            cp qr/package/qrcode.js site/vendor/qrcode/
            cp qr/package/LICENSE* site/vendor/qrcode/ 2>/dev/null || true
            rm -rf qr qrcode-generator-*.tgz
          fi

      - name: Nostr-Bibliothek einbinden (nostr-tools, Unlicense; einmalig ins Repo)
        run: |
          if [ ! -f site/vendor/nostr/package.json ]; then
            npm pack nostr-tools@2 --silent
            mkdir -p nt && tar -xzf nostr-tools-*.tgz -C nt
            mkdir -p site/vendor/nostr
            cp nt/package/package.json nt/package/LICENSE* site/vendor/nostr/ 2>/dev/null || true
            cp nt/package/lib/nostr.bundle.js site/vendor/nostr/ 2>/dev/null || true
            (cd nt/package && find . -maxdepth 3 -type f | sort) > site/vendor/nostr/DATEIEN.txt
            rm -rf nt nostr-tools-*.tgz
          fi

      - name: Texterkennung einbinden (tesseract.js, Apache-2.0; einmalig ins Repo)
        run: |
          if [ ! -f site/vendor/tesseract/tesseract.min.js ]; then
            mkdir -p site/vendor/tesseract/core site/vendor/tesseract/lang tz
            cd tz
            npm pack tesseract.js@5 tesseract.js-core@5 @tesseract.js-data/por@1 --silent
            for f in *.tgz; do mkdir -p "${f%.tgz}"; tar -xzf "$f" -C "${f%.tgz}"; done
            { ls *.tgz; find . -type f \( -name '*.wasm.js' -o -name '*.traineddata.gz' -o -name '*.min.js' -o -name 'LICENSE*' \) -printf '%s %p\n'; } > ../site/vendor/tesseract/DATEIEN.txt
            T=$(ls -d tesseract.js-5* | head -1); C=$(ls -d tesseract.js-core-5* | head -1); L=$(ls -d tesseract.js-data-por-* | head -1)
            cp $T/package/dist/tesseract.min.js $T/package/dist/worker.min.js ../site/vendor/tesseract/
            cp $T/package/LICENSE* ../site/vendor/tesseract/ 2>/dev/null || true
            cp $T/package/package.json ../site/vendor/tesseract/package-tesseract.json
            cp $C/package/tesseract-core*.wasm.js ../site/vendor/tesseract/core/
            cp $C/package/package.json ../site/vendor/tesseract/package-core.json
            LG=$(find $L -path '*4.0.0_best_int*' -name 'por.traineddata.gz' | head -1); [ -z "$LG" ] && LG=$(find $L -name 'por.traineddata.gz' | head -1)
            cp "$LG" ../site/vendor/tesseract/lang/por.traineddata.gz
            echo "Sprachdaten: $LG" >> ../site/vendor/tesseract/DATEIEN.txt
            cd .. && rm -rf tz
          fi

      - name: QR-Leser einbinden (jsQR 1.4.0, Apache-2.0; einmalig ins Repo)
        run: |
          if [ ! -f site/vendor/jsqr/jsQR.js ]; then
            mkdir -p site/vendor/jsqr qz && cd qz
            npm pack jsqr@1.4.0 --silent && tar -xzf jsqr-1.4.0.tgz
            cp package/dist/jsQR.js package/LICENSE* package/package.json ../site/vendor/jsqr/ 2>/dev/null || cp package/dist/jsQR.js ../site/vendor/jsqr/
            cd .. && rm -rf qz
          fi

      - name: Ergebnisse im Repo sichern
        run: |
          git add site/orte.json site/bilder data/cache.json data/pruefbericht.md site/vendor
          if [ -f site/umgebung.json ]; then git add site/umgebung.json; fi
          if [ -f site/stadtfuehrer.json ]; then git add site/stadtfuehrer.json; fi
          for f in site/hoehe.json site/hoehe.bin site/laender.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit -m "Daten aktualisiert"
            # Zwei Läufe kurz nacheinander: Konflikt in den erzeugten Dateien heißt, ein neuerer Lauf erzeugt sie ohnehin neu
            if git pull --rebase origin main; then git push; else git rebase --abort; echo "Daten-Commit übersprungen: neuerer Stand im Repo"; fi
          fi

      - name: Protokoll sichern (Branch ci-logs)
        if: always()
        continue-on-error: true
        run: |
          bash tools/ci-log.sh wetter.txt site/wetter.json umgebung.txt stadtfuehrer.txt hoehe.txt laender.txt

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
